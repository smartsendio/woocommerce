name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  pest:
    name: Pest integration tests (PHP ${{ matrix.php-version }} / WP ${{ matrix.wp-version }} / WC ${{ matrix.wc-version }})${{ matrix.canary && ' [canary]' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Unlike the browser tests, WordPress + WooCommerce run inside the
        # Pest process here, so the matrix floor is Pest's own requirement
        # (PHP 8.3+). Plugin-code coverage of older PHP (7.4-8.2) comes from
        # the browser test matrix and the PHPCompatibility scan in the
        # coding-standards workflow. The test bootstrap turns any PHP
        # warning/notice/deprecation raised from smart-send-logistics/ into
        # a test failure, so each matrix leg also proves the plugin runs
        # warning-free on that PHP version.
        #
        # Every PHP version Pest supports runs against the latest WP/WC; the
        # `floor` leg below runs the oldest supported WordPress + WooCommerce
        # (readme.txt: WP 6.5+, WC 8.2+) on Pest's oldest PHP. Intermediate
        # WP/WC versions are not tested - one `latest` and one `floor` leg
        # is the goal.
        php-version: ['8.3', '8.4', '8.5']
        wp-version: ['latest']
        wc-version: ['latest']
        include:
          # Latest patch release of each floor version; verify the zips
          # exist on wordpress.org before bumping.
          #
          # CANARY (continue-on-error) until #184 is fixed: 4 of 302 tests
          # pin the rate cost string of the latest WooCommerce ("cost 49")
          # while WooCommerce 8.2's WC_Shipping_Rate::get_cost() yields
          # "49.00" (first seen in run 34955850934); the other 298 pass on
          # the floor. Drop the `canary` key once #184 lands so the leg
          # blocks merges again.
          - php-version: '8.3'
            wp-version: '6.5.10'
            wc-version: '8.2.5'
            canary: true
    # A canary leg reports its result but never fails the workflow.
    continue-on-error: ${{ matrix.canary == true }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php-version }}'
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-php${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-php${{ matrix.php-version }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Set up the development store
        # SQLite is fine here: the suite runs in a single PHP process, so the
        # concurrency-related SQLite crashes seen with php-fpm do not apply.
        # No web server is needed either - WordPress is loaded in-process.
        run: |
          bin/setup-local-dev.sh \
            --path ./local-dev/wordpress \
            --url http://127.0.0.1:8181 \
            --wp-version "${{ matrix.wp-version }}" \
            --wc-version "${{ matrix.wc-version }}" \
            --skip-seed

      - name: Run Pest integration tests
        run: vendor/bin/pest --testsuite=Integration

      - name: Show WordPress debug log
        if: failure()
        run: tail -n 200 ./local-dev/wordpress/wp-content/debug.log || true
