name: Browser Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pest:
    name: Pest browser tests (PHP ${{ matrix.php-version }} / WP ${{ matrix.wp-version }} / WC ${{ matrix.wc-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The store (WordPress + WooCommerce + the Smart Send plugin) runs on
        # the matrix PHP version. Pest itself always runs on PHP 8.4 (see the
        # tooling setup below) since its dependencies require it.
        #
        # PHP 7.4 is the floor for the latest WooCommerce; testing the plugin's
        # older declared support (PHP 5.6+) would require pinning older
        # WP/WC versions via extra include entries.
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
        wp-version: ['latest']
        wc-version: ['latest']

    steps:
      - uses: actions/checkout@v4

      - name: Set up store PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php-version }}'
          coverage: none

      - name: Set up tooling PHP (Pest/Composer)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Set up the development store
        env:
          PHP_BIN: php${{ matrix.php-version }}
        run: |
          $PHP_BIN --version
          bin/setup-local-dev.sh \
            --path ./local-dev/wordpress \
            --url http://127.0.0.1:8181 \
            --wp-version "${{ matrix.wp-version }}" \
            --wc-version "${{ matrix.wc-version }}"

      - name: Start the store
        # The PHP built-in server can occasionally crash under load, so run it
        # in a restart loop and keep its output for debugging.
        env:
          PHP_BIN: php${{ matrix.php-version }}
        run: |
          nohup bash -c 'while true; do
            PHP_CLI_SERVER_WORKERS=4 '"$PHP_BIN"' -d memory_limit=512M \
              ./local-dev/wordpress/.wp-cli/wp-cli.phar \
              --path=./local-dev/wordpress \
              server --host=127.0.0.1 --port=8181 >> server.log 2>&1
            echo "--- server exited with code $?, restarting ---" >> server.log
            sleep 1
          done' >/dev/null 2>&1 &
          timeout 30 bash -c 'until curl -sf -o /dev/null http://127.0.0.1:8181/; do sleep 1; done'

      - name: Run Pest browser tests
        env:
          WP_BASE_URL: http://127.0.0.1:8181
        run: vendor/bin/pest

      - name: Show server and WordPress logs
        if: failure()
        run: |
          echo "::group::server.log"
          tail -n 200 server.log || true
          echo "::endgroup::"
          echo "::group::wp-content/debug.log"
          tail -n 200 ./local-dev/wordpress/wp-content/debug.log || true
          echo "::endgroup::"

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pest-browser-screenshots-php${{ matrix.php-version }}-${{ matrix.wp-version }}-${{ matrix.wc-version }}
          path: tests/Browser/Screenshots
          if-no-files-found: ignore
