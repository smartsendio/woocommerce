name: Browser Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  pest:
    name: Pest browser tests (PHP ${{ matrix.php-version }} / WP ${{ matrix.wp-version }} / WC ${{ matrix.wc-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The store (WordPress + WooCommerce + the Smart Send plugin) runs on
        # the matrix PHP version. Pest itself always runs on PHP 8.4 (see the
        # tooling setup below) since its dependencies require it.
        #
        # PHP 7.4 is the floor for the latest WooCommerce; testing the plugin's
        # older declared support (PHP 5.6+) would require pinning older
        # WP/WC versions via extra include entries.
        # PHP 8.1 and 8.2 were temporarily removed on 2026-08-11 (PR #80)
        # when the runner environment deterministically segfaulted php-fpm
        # workers on those versions. Restored as a canary together with the
        # #79 hardening (worker recycling, core-dump capture) — if they go
        # deterministically red again with the same environment signature,
        # drop them again and record it on #79.
        # PHP 8.4 was temporarily removed on 2026-08-20 after going
        # deterministically red the same way (5 of 6 attempts across PRs
        # #167/#168, fpm SIGSEGV consistently striking the block checkout's
        # /wp-json/wc/store/v1/batch render; the in-job fpm-restart retry no
        # longer rescues it). Evidence and the canary reminder live on #79.
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3']
        wp-version: ['latest']
        wc-version: ['latest']

    steps:
      - uses: actions/checkout@v4

      - name: Set up store PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php-version }}'
          coverage: none

      - name: Set up tooling PHP (Pest/Composer)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start MySQL
        # Use the runner's preinstalled MySQL: with SQLite, concurrent fpm
        # workers intermittently segfaulted PHP inside the SQLite driver.
        run: |
          sudo systemctl start mysql
          mysql -uroot -proot -e "SELECT VERSION();"

      - name: Set up the development store
        env:
          PHP_BIN: php${{ matrix.php-version }}
        run: |
          $PHP_BIN --version
          bin/setup-local-dev.sh \
            --path ./local-dev/wordpress \
            --url http://127.0.0.1:8181 \
            --wp-version "${{ matrix.wp-version }}" \
            --wc-version "${{ matrix.wc-version }}" \
            --db-engine mysql \
            --db-name smartsend_woo_test \
            --db-user root \
            --db-pass root \
            --db-host 127.0.0.1

      - name: Start the store (nginx + php-fpm)
        # The PHP built-in CLI server segfaults intermittently under
        # Playwright's parallel requests, so serve the store with nginx and
        # php-fpm instead — fpm recycles a crashed worker without downtime.
        run: |
          PHPV="${{ matrix.php-version }}"
          DOCROOT="$GITHUB_WORKSPACE/local-dev/wordpress"

          sudo tee /etc/nginx/sites-available/default > /dev/null <<NGINX
          server {
              listen 8181;
              root $DOCROOT;
              index index.php;
              location / {
                  try_files \$uri \$uri/ /index.php?\$args;
              }
              location ~ \.php\$ {
                  include snippets/fastcgi-php.conf;
                  fastcgi_pass unix:/run/php/php$PHPV-fpm.sock;
              }
          }
          NGINX

          # The workspace lives under /home/runner, which www-data cannot read
          # (and PHP needs write access for the SQLite database), so run the
          # nginx workers and the fpm pool as the runner user.
          sudo sed -i 's/^user .*/user runner;/' /etc/nginx/nginx.conf
          sudo sed -i \
            -e 's/^user = .*/user = runner/' \
            -e 's/^group = .*/group = runner/' \
            -e 's/^listen\.owner = .*/listen.owner = runner/' \
            -e 's/^listen\.group = .*/listen.group = runner/' \
            "/etc/php/$PHPV/fpm/pool.d/www.conf"

          # PCRE JIT causes intermittent SIGSEGV in fpm workers rendering
          # WooCommerce pages on some PHP versions; opcache is disabled too
          # since compile speed is irrelevant for a short-lived test store.
          printf 'pcre.jit=0\nopcache.enable=0\n' | \
            sudo tee "/etc/php/$PHPV/fpm/conf.d/99-ci-stability.ini" > /dev/null

          # Keep core dumps from crashed fpm workers so the next SIGSEGV is
          # diagnosable to a stack frame (#79). The runner's default
          # core_pattern pipes into apport, which discards cores from the
          # PPA-built php-fpm, so point it at a plain directory instead.
          sudo mkdir -p /var/crash-ci
          sudo chmod 1777 /var/crash-ci
          sudo sysctl -q -w kernel.core_pattern='/var/crash-ci/core.%e.%p.%t'

          # Use a static pool: workers forked mid-run under load have been
          # observed to crash within seconds; a fixed pool avoids forking
          # while requests are in flight.
          #
          # pm.max_requests recycles each worker after 50 requests: the
          # 2026-08-12 PHP 8.4 flakes all struck long-lived workers (SIGSEGV
          # or a stuck-request hard-timeout _exit(124) after 9-50s of worker
          # life, on arbitrary stock pages), pointing at worker-state
          # corruption that accumulates with age (#79).
          #
          # rlimit_core lets a crashing worker actually write the core dump
          # captured above (#79).
          sudo tee -a "/etc/php/$PHPV/fpm/pool.d/www.conf" > /dev/null <<'POOL'
          pm = static
          pm.max_children = 8
          pm.max_requests = 50
          rlimit_core = unlimited
          POOL

          sudo service "php$PHPV-fpm" restart
          sudo service nginx restart
          timeout 30 bash -c 'until curl -sf -o /dev/null http://127.0.0.1:8181/; do sleep 1; done'

          # Warm the front page, shop and admin so the first browser test does
          # not pay the cold-cache compile cost (it can exceed the 10s action
          # timeout on a cold stack).
          curl -sf -o /dev/null http://127.0.0.1:8181/shop/ || true
          curl -sf -o /dev/null http://127.0.0.1:8181/wp-login.php || true

      - name: Run Pest browser tests
        timeout-minutes: 10
        env:
          WP_BASE_URL: http://127.0.0.1:8181
        # The tests are self-contained, so retry the suite once to absorb
        # rare fpm worker crashes; persistent failures still fail both runs.
        # Restart php-fpm before the retry: a crashed worker can leave the
        # pool wedged, making the retry hang until the step timeout (#79).
        #
        # Each attempt is bounded with timeout(1): a green suite finishes in
        # about a minute, but a single wedged request has been observed to
        # hang an attempt until the 10-minute step timeout, so an unbounded
        # first attempt (or retry) costs the whole job (#79, run
        # 31552508461). 270s x 2 attempts still fits inside the step timeout.
        run: |
          timeout -k 15 270 vendor/bin/pest --testsuite=Browser || {
            echo "::warning::Browser test run failed - restarting php-fpm and retrying once"
            sudo service "php${{ matrix.php-version }}-fpm" restart
            sleep 2
            timeout -k 15 270 vendor/bin/pest --testsuite=Browser
          }

      - name: Show server and WordPress logs
        if: failure()
        run: |
          echo "::group::nginx error.log"
          sudo tail -n 100 /var/log/nginx/error.log || true
          echo "::endgroup::"
          echo "::group::php-fpm log"
          sudo tail -n 100 /var/log/php${{ matrix.php-version }}-fpm.log || true
          echo "::endgroup::"
          echo "::group::wp-content/debug.log"
          tail -n 200 ./local-dev/wordpress/wp-content/debug.log || true
          echo "::endgroup::"
          # Backtrace any fpm worker core dumps captured via the
          # core_pattern/rlimit_core setup above, so a SIGSEGV resolves to a
          # stack frame instead of just "signal 11" in the fpm log (#79).
          echo "::group::php-fpm core dump backtraces"
          # Debug symbols are best-effort: the ondrej PPA ships -dbgsym
          # packages for some builds; without them gdb still names the
          # faulting shared object and offsets.
          command -v gdb > /dev/null || \
            sudo apt-get install -y --no-install-recommends gdb > /dev/null || true
          sudo apt-get install -y --no-install-recommends \
            "php${{ matrix.php-version }}-fpm-dbgsym" > /dev/null 2>&1 || true
          for core in /var/crash-ci/core.*; do
            [ -e "$core" ] || continue
            echo "--- $core"
            sudo gdb --batch \
              -ex 'set pagination off' \
              -ex 'bt' \
              -ex 'info sharedlibrary' \
              "/usr/sbin/php-fpm${{ matrix.php-version }}" "$core" || true
          done
          echo "::endgroup::"

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pest-browser-screenshots-php${{ matrix.php-version }}-${{ matrix.wp-version }}-${{ matrix.wc-version }}
          path: tests/Browser/Screenshots
          if-no-files-found: ignore
