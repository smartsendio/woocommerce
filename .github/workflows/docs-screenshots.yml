name: Docs Screenshots

# Manual only - this suite is not correctness testing (see tests/Docs and
# CLAUDE.md "Testing"), so it never blocks a PR. Screenshots are uploaded as
# a build artifact for a human to review and commit, not committed by CI.
on:
  workflow_dispatch: {}

jobs:
  pest:
    name: Generate Docs suite screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Set up the development store
        run: |
          bin/setup-local-dev.sh \
            --path ./local-dev/wordpress \
            --url http://127.0.0.1:8181

      - name: Start the store
        run: |
          php -d memory_limit=512M local-dev/wordpress/.wp-cli/wp-cli.phar \
            --path=local-dev/wordpress server --host=127.0.0.1 --port=8181 &
          timeout 30 bash -c 'until curl -sf -o /dev/null http://127.0.0.1:8181/; do sleep 1; done'

      - name: Run Pest Docs suite
        env:
          WP_BASE_URL: http://127.0.0.1:8181
          # No display on the runner - the CI env var (set by GitHub Actions)
          # already makes tests/Pest.php fall back to headless, this is
          # belt-and-braces for anyone copying the step to run locally.
          SS_DOCS_HEADLESS: '1'
        run: vendor/bin/pest --testsuite=Docs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-screenshots
          path: docs/screenshots
          if-no-files-found: warn
