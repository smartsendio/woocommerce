name: Release Tools

on:
  push:
    branches: [main, develop]
    paths:
      - 'bin/svn-deploy.sh'
      - 'tests/Release/**'
      - '.github/workflows/release-tools.yml'
  pull_request:
    paths:
      - 'bin/svn-deploy.sh'
      - 'tests/Release/**'
      - '.github/workflows/release-tools.yml'

jobs:
  svn-package:
    name: SVN release package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Subversion
        run: sudo apt-get update -qq && sudo apt-get install -y subversion

      - name: Check shell syntax
        run: bash -n bin/svn-deploy.sh tests/Release/svn-deploy.sh

      # Uses temporary file:// repositories only; never WordPress.org.
      - name: Verify trunk and tag contents after a release
        run: bash tests/Release/svn-deploy.sh
